<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;font-family:'Helvetica Neue',Arial,sans-serif;background:#111;color:#fff;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 85% 8%,#ff7a1a 0,transparent 45%),radial-gradient(circle at 5% 95%,#c2410c 0,transparent 50%),#14110f}
.ring{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.08)}
.wrap{position:relative;padding:70px 80px;height:100%;display:flex;flex-direction:column}
.tag{align-self:flex-start;background:#ffb020;color:#1a1208;font-weight:800;letter-spacing:3px;font-size:28px;padding:12px 26px;border-radius:40px}
h1{margin-top:36px;font-size:116px;line-height:.98;font-weight:900;letter-spacing:-2px}
h1 span{color:#ffb020}
.sub{margin-top:24px;font-size:34px;color:#e8ddd2;line-height:1.35;max-width:820px}
.inc{margin-top:40px;display:flex;align-items:center;gap:28px;background:#fff;color:#14110f;border-radius:28px;padding:26px 36px;align-self:flex-start}
.inc small{font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#c2410c;display:block}
.inc b{font-size:88px;font-weight:900;line-height:1}
.inc i{font-style:normal;font-size:34px;font-weight:700}
.bottom{margin-top:auto;display:flex;align-items:flex-end;gap:44px}
.qr{background:#fff;padding:18px;border-radius:24px}
.qr img{width:330px;display:block}
.cta h2{font-size:52px;font-weight:900;line-height:1.1}
.cta p{margin-top:14px;font-size:28px;color:#e8ddd2;line-height:1.4}
.pill{display:inline-block;margin-top:18px;border:2px solid #ffb020;color:#ffb020;padding:10px 22px;border-radius:30px;font-size:26px;font-weight:700}
</style></head><body><div class="bg"></div>
<div class="ring" style="width:700px;height:700px;right:-250px;top:-200px"></div>
<div class="ring" style="width:500px;height:500px;right:-150px;top:-100px"></div>
<div class="wrap">
<div class="tag">FGD · RISET KONSUMEN</div>
<h1>DICARI<br><span>PEROKOK</span><br>AKTIF!</h1>
<p class="sub">Yuk jadi responden riset konsumen — bagikan pendapatmu dan dapatkan insentif.</p>
<div class="inc"><div><small>Insentif</small><b>Rp100.000</b></div><i>/ orang</i></div>
<div class="bottom">
<div class="qr"><img src="qr.png"></div>
<div class="cta"><h2>Scan QR<br>untuk daftar</h2><p>Isi formulir pendaftaran FGD, tim kami akan menghubungi kamu.</p><span class="pill">Daftar sekarang</span></div>
</div></div></body></html>
